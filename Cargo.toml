[workspace]
resolver = "3"
members = [
    "crates/quarryd",
    "crates/proto",
    "crates/reconciler",
    "crates/sandbox",
    "crates/volume",
    "crates/network",
    "crates/guest-proto",
    "crates/usage",
    "crates/store",
    "crates/stub-control-plane",
    "guest-agent",
    "quarryctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
proto = { path = "crates/proto" }
reconciler = { path = "crates/reconciler" }
sandbox = { path = "crates/sandbox" }
volume = { path = "crates/volume" }
network = { path = "crates/network" }
guest-proto = { path = "crates/guest-proto" }
usage = { path = "crates/usage" }
store = { path = "crates/store" }

tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protox = "0.10"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["x509-parser", "pem"] }

rusqlite = { version = "0.41", features = ["bundled"] }

hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"

rtnetlink = "0.23"
zbus = { version = "6", default-features = false, features = ["tokio"] }
tokio-vsock = "0.7"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
object_store = { version = "0.14", features = ["aws"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
minisign-verify = "0.3"
zstd = "0.14"
nix = { version = "0.31", features = ["signal", "process", "fs", "sched", "mount", "ioctl", "user", "net"] }
libc = "0.2"
tempfile = "3"
